[tool.black]
line-length = 88
target-version = ["py37"]
include = "\\.pyi?$"
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
py_version = 37

[tool.pylint.main]
py-version = "3.12"
persistent = false

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = [
  "bare-except",
  "broad-exception-caught",
  "broad-exception-raised",
  "consider-using-from-import",
  "duplicate-code",
  "line-too-long",
  "no-else-return",
  "raise-missing-from",
  "too-many-branches",
  "too-many-locals",
  "too-many-return-statements",
  "too-many-statements",
]
