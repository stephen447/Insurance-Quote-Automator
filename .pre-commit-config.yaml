minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: python
        types: [python]
        require_serial: true
        additional_dependencies:
          - pylint==4.0.8
          - playwright>=1.45.0
          - playwright-stealth>=2.0.0,<3.0.0
